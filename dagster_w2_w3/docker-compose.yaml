services:
  # LakeFS - our data versioning layer. It acts like Git for data files.
  # We wait for it to be healthy before starting anything else.
  lakefs:
    build:
      context: .
      dockerfile: Dockerfile.lakefs
    user: "root"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LAKEFS_BLOCKSTORE_TYPE=local
      - LAKEFS_BLOCKSTORE_LOCAL_PATH=/home/lakefs/data
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=super_secret_encryption_key_123
      - LAKEFS_DATABASE_TYPE=local
      - LAKEFS_DATABASE_LOCAL_PATH=/home/lakefs/data/_metadata
    volumes:
      - lakefs_data:/home/lakefs/data
    networks:
      - mlops_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/_health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # This container handles one-time setup: creating the repo and loading our CSV files.
  # Once it finishes uploading everything, it shuts down automatically.
  lakefs-setup:
    image: treeverse/lakectl:latest  # Using the lakeFS CLI tool to manage repos and uploads
    user: "root" 
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./scripts/load_data.sh:/load_data.sh
    entrypoint: ["/bin/sh", "/load_data.sh"]
    depends_on:
      lakefs:
        condition: service_healthy
    networks:
      - mlops_network
  
  # MLflow tracks all our model experiments, parameters, metrics, and artifacts.
  # We use this to compare different models and pick the best one.
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --serve-artifacts --allowed-hosts "*"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - mlops_network

  # FastAPI service that exposes our trained model as a REST API.
  # Other services can hit /predict to get bike rental forecasts.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - mlops_network
    volumes:
      - mlflow_data:/mlflow

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - LAKECTL_SERVER_ENDPOINT_URL=http://lakefs:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      lakefs-setup:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    networks:
      - mlops_network
    volumes:
      - mlflow_data:/mlflow

volumes:
  mlflow_data:
  lakefs_data:

networks:
  mlops_network:
    driver: bridge